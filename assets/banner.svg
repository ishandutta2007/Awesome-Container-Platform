<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
      
      /* Background dynamic animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      
      .bg-wave {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-node {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .connect-line {
        stroke-dasharray: 8 8;
        animation: dashMove 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>
  
  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g class="bg-wave" opacity="0.3">
    <circle cx="150" cy="80" r="180" fill="url(#glowGrad)" />
    <circle cx="1050" cy="280" r="220" fill="url(#glowGrad)" />
  </g>

  <!-- Background Decorative Grid / Nodes (Low Opacity) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
  </g>

  <!-- Dynamic Connecting Animated Lines (Background Layer) -->
  <path class="connect-line" d="M 850 90 L 1020 160 L 940 270" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <path class="connect-line" d="M 150 280 L 280 200 L 180 100" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3"/>

  <!-- Subtle Floating Decorative Icons / Cubes (Background Right Side) -->
  <g class="floating-node" opacity="0.35" transform="translate(920, 80)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 20 20 L 40 20 L 40 40 L 20 40 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <g class="floating-node" opacity="0.25" transform="translate(1040, 200)">
    <rect x="0" y="0" width="50" height="50" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast) -->
  <g transform="translate(80, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="260" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="18" y="22" class="badge-text">⚡ KUBERNETES &amp; CONTAINERS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title" filter="url(#glow)">Awesome Container Platform</text>
    <rect x="0" y="182" width="680" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects</text>
    <text x="0" y="258" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" font-weight="500">
      Multi-Cluster Management • Enterprise Runtimes • Control Planes • GitOps &amp; Security
    </text>
  </g>

  <!-- Container Graphic Element (Right Side Foreground) -->
  <g transform="translate(980, 110)">
    <!-- Hexagon Outer -->
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
    <!-- Inner Container Grid Lines -->
    <path d="M 60 0 L 60 140 M 0 35 L 120 105 M 0 105 L 120 35" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <circle cx="60" cy="70" r="16" fill="#38bdf8" opacity="0.8"/>
  </g>

</svg>
